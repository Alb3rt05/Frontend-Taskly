<div class="profile-page">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Content -->
  <main class="profile-main">
    <!-- Hero -->
    <app-hero-card
      subtitle="Gestisci profilo"
      title="Gestisci i tuoi dati personali e i progetti che hai creato"
      buttonText="Salva modifiche"
      (saveProfile)="TODO()"
    >
    </app-hero-card>

    <!-- Content -->
    <section class="profile-content">
      <!-- Profilo -->
      <div class="profile-info card">
        <h2>Profilo</h2>
        <div class="form-group">
          <label>Nome utente</label>
          <div class="input-display">Mario</div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <div class="input-display">mario@gmail.com</div>
        </div>
      </div>

      <!-- Modifica -->
      <div class="profile-info card">
        <h2>Modifica</h2>
        <div class="form-group">
          <label for="username">Nome utente</label>
          <input
            type="text"
            id="username"
            class="form-input"
            value="Mario"
            placeholder="Inserisci il nome utente"
          />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            class="form-input"
            value="mario@gmail.com"
            placeholder="Inserisci l'email"
          />
        </div>
        <button class="btn-primary">Salva</button>
      </div>
    </section>
  </main>
</div>
