<div class="profile-page">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Content -->
  <main class="profile-main">
    <!-- Hero -->
    <app-hero-card
      subtitle="Gestisci profilo"
      title="Gestisci i tuoi dati personali e i progetti che hai creato"
      buttonText="Salva modifiche"
      (saveProfile)="TODO()">
    </app-hero-card>

    <!-- Content -->
    <section class="profile-content">
      <!-- Profilo -->
      <div class="profile-info card">
        <h2>Profilo</h2>
        <div class="form-group">
          <label>Nome utente</label>
          <div class="input-display">Mario</div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <div class="input-display">mario@gmail.com</div>
        </div>
      </div>

      <!-- Progetti -->
      <div class="profile-projects card">
        <h2>I tuoi progetti</h2>
        <div class="projects-sidebar">
          <ul>
            <li class="project-item active">First Project
              <button class="action edit">✏️</button>
              <button class="action delete">🗑️</button>
            </li>
            <li class="project-item">Second Project</li>
            <li class="project-item">Work prj</li>
            <li class="project-item">Freelance</li>
          </ul>
        </div>
      </div>
    </section>
  </main>
</div>
