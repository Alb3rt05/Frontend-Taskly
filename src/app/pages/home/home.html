<div class="home">
  <app-sidebar></app-sidebar>

  <main class="main">

    <!-- Add Project Modal -->
    <app-add-project *ngIf="showAddProjectModal" (close)="closeAddProjectModal()"
      (created)="closeAddProjectModal(true)">
    </app-add-project>

    <!-- Add Task Modal -->
    <app-add-task *ngIf="showAddTaskModal"
      [projectId]="projects[selectedProjectIndex]?.id ?? projects[selectedProjectIndex]?._id?.$oid"
      [phases]="projects[selectedProjectIndex]?.phases || []" (close)="closeAddTaskModal()"
      (created)="closeAddTaskModal(true)">
    </app-add-task>

    <!-- Edit Task Modal -->
    <app-edit-task *ngIf="showEditTaskModal && selectedTaskForEdit" [task]="selectedTaskForEdit"
      [phases]="projects[selectedProjectIndex]?.phases || []" (close)="closeEditTaskModal()"
      (updated)="closeEditTaskModal(true)">
    </app-edit-task>

    <app-hero-card (createProject)="openAddProjectModal()"></app-hero-card>

    <section class="projects-header">
      <div>
        <h2>Progetti</h2>
        <p>Visualizza e organizza i tuoi progetti.</p>
      </div>
    </section>

    <div *ngIf="projects.length > 0" class="projects-sidebar">
      <div class="projects-title">Tutti i progetti</div>
      <ul>
        <li *ngFor="let project of projects; let i = index" class="project-item" [class.active]="project.active"
          (click)="selectProject(i)">
          <app-project-card [project]="project" (edit)="editProject($event)" (delete)="deleteProject($event)">
          </app-project-card>
        </li>
        <li class="add-project" (click)="addProject()">+</li>
      </ul>
    </div>

    <p *ngIf="projects.length === 0">Nessun progetto trovato</p>

    <div *ngIf="projectPhases.length > 0" class="project-content">
      <app-project-content *ngFor="let phase of projectPhases" [phase]="phase"></app-project-content>
    </div>
  </main>
</div>
