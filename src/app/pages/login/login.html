<div class="content">
  <section class="Left">
    <div class="login-container">
      <div class="login-card">
        <h2>Taskly</h2>

        <div class="login-intro">
          <div class="login-title">Sign in</div>
          <div class="login-subtitle">Accedi per continuare</div>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <label>Email</label>
          <input
            type="text"
            formControlName="username"
            autocomplete="username"
            placeholder="mario@gmail.com"
          />
          <div class="error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
            Email obbligatoria
          </div>

          <label>Password</label>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="v£&7DW%2vuK"
          />
          <div class="error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
            Password obbligatoria
          </div>

          <button type="submit" [disabled]="loading">
            {{ loading ? 'Verifica...' : 'Accedi' }}
          </button>

          <p *ngIf="error" class="error">{{ error }}</p>
        </form>
      </div>
    </div>
  </section>

  <section class="right">
    <h5>Taskly Project</h5>
    <h2>Bentornato! Pronto a creare qualcosa di nuovo?</h2>
    <div class="image">
      <img src="/materials/login.png" alt="Login image" />
    </div>
  </section>
</div>
