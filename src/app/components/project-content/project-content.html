<div class="project-phase card">
  <h3>{{ phase.name }}</h3>

  <!-- Tasks da fare -->
  <ul *ngIf="phase.tasks && phase.tasks.length > 0" class="tasks-todo">
    <li *ngFor="let task of phase.tasks">
      <div class="task">
        <div class="task-title">{{ task.title }}</div>
        <div class="task-meta">
          <small *ngIf="task.assignees?.length">
            Assegnati: {{ task.assignees?.length }}
          </small>
          <small *ngIf="task.dueDate">
            • scadenza: {{ task.dueDate | date:'short' }}
          </small>
        </div>
      </div>
    </li>
  </ul>

  <!-- Nessun task -->
  <div *ngIf="!phase.tasks || phase.tasks.length === 0" class="no-tasks">
    Nessun task
  </div>
</div>
