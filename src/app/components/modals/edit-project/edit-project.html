<div class="overlay">
  <div class="modal">
    <h2>Modifica Progetto</h2>
    <form (ngSubmit)="submit()">
      <label>Titolo</label>
      <input type="text" [(ngModel)]="title" name="title" required />

      <div class="buttons">
        <button type="submit">Salva</button>
        <button type="button" (click)="cancel()">Annulla</button>
      </div>
    </form>
  </div>
</div>
