<div class="overlay">
  <div class="modal">
    <h2>Modifica Task</h2>
    <form (ngSubmit)="submit()">
      <label>Titolo</label>
      <input type="text" [(ngModel)]="title" name="title" required />
      
      <label>Descrizione</label>
      <textarea [(ngModel)]="description" name="description"></textarea>
      
      <label>Fase</label>
      <select [(ngModel)]="phaseId" name="phase" required>
        <option *ngFor="let p of phases" [value]="p.id">{{p.title}}</option>
      </select>
      
      <label>Scadenza</label>
      <input type="date" [(ngModel)]="dueDate" name="dueDate" />
      
      <div class="buttons">
        <button type="submit">Salva</button>
        <button type="button" (click)="cancel()">Annulla</button>
      </div>
    </form>
  </div>
</div>
