<section class="hero card">
  <div class="hero-text">
    <p class="hero-sub">{{ subtitle }}</p>
    <h1 class="hero-content">{{ title }}</h1>
    <!-- Button -->
    <button class="btn" (click)="onCreateProject()">
      <p class="btn-text">{{ buttonText }}</p>
      <img class="btn-icon" src="/icons/createProject.svg" />
    </button>
  </div>
  <img class="hero-image" [src]="heroImage" />
</section>
